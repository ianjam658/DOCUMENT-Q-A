services:
  - type: web
    name: doc-qa-app
    env: python
    plan: starter
    healthCheckPath: /health
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120 --access-logfile -
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: "llama-3.3-70b-versatile"
      - key: API_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: docqa-db
          property: connectionString
      - key: MAX_FILE_SIZE_MB
        value: "15"
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: RATE_LIMIT_DEFAULT
        value: "60 per minute"
      - key: RATE_LIMIT_UPLOAD
        value: "10 per minute"
      - key: RATE_LIMIT_ASK
        value: "20 per minute"

databases:
  - name: docqa-db
    plan: starter
    postgresMajorVersion: "16"
